[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openai>=3.16.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires TEST_DATABASE_URL pointing to PostgreSQL",
    "live: explicitly enabled real OpenAI request (billable)",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "SIM"]
