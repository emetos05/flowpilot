services:
  api:
    build: ./apps/api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)) == {'status': 'ok'}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  web:
    build: ./apps/web
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(async r => { if (!r.ok || !(await r.text()).includes('Backend is healthy')) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
